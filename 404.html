<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>页面未找到 · 绍派伤寒 知识图谱</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%23b4382c'/%3E%3Ctext x='16' y='23' font-size='20' text-anchor='middle' fill='%23fdf6e8' font-family='serif'%3E绍%3C/text%3E%3C/svg%3E">
<script>
(function(){var t=null;try{t=localStorage.getItem('sp-theme');}catch(e){}
 if(t!=='paper'&&t!=='ink') t=matchMedia('(prefers-color-scheme: light)').matches?'paper':'ink';
 document.documentElement.dataset.theme=t;})();
</script>
<style>
:root{
  --kai:"Kaiti SC","STKaiti",KaiTi,"Kaiti TC","Songti SC",serif;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;
  --bg:#0d1015; --surface:#171b23; --ink:#eae5d8; --dim:#877f6d; --line:#2a313d;
  --cinnabar:#e0715c; --accent:#d6a95a;
}
html[data-theme="paper"]{
  --bg:#f3ede1; --surface:#faf6ec; --ink:#1f1d19; --dim:#7b7263; --line:#dccfb6;
  --cinnabar:#b4382c; --accent:#a5771f;
}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;
  background:var(--bg);color:var(--ink);text-align:center;
  font:15px/1.95 "Songti SC","Noto Serif CJK SC","STSong",SimSun,Georgia,serif}
.seal{width:74px;height:74px;border-radius:9px;background:var(--cinnabar);color:#fdf6e8;
  margin:0 auto 26px;display:grid;grid-template-columns:1fr 1fr;place-items:center;padding:7px;
  font-family:var(--kai);font-size:23px;line-height:1;transform:rotate(-4deg);
  box-shadow:0 14px 34px -14px color-mix(in srgb,var(--cinnabar) 85%,transparent)}
.seal span:nth-child(1){grid-area:1/2}.seal span:nth-child(2){grid-area:2/2}
.seal span:nth-child(3){grid-area:1/1}.seal span:nth-child(4){grid-area:2/1}
h1{margin:0;font-family:var(--kai);font-size:clamp(2.4rem,9vw,3.6rem);font-weight:400;letter-spacing:.16em}
.sub{margin:.5rem 0 0;font-family:var(--sans);font-size:11.5px;letter-spacing:.3em;color:var(--dim);
  text-transform:uppercase}
p.msg{margin:1.6rem auto 0;max-width:30em;color:var(--dim);font-size:14.5px}
.acts{display:flex;flex-wrap:wrap;gap:.7rem;justify-content:center;margin-top:2.2rem}
a.btn{display:inline-flex;align-items:center;gap:.45rem;padding:.6rem 1.25rem;border-radius:999px;
  text-decoration:none;font-size:14px;letter-spacing:.05em;border:1px solid transparent;transition:.22s}
a.solid{background:var(--cinnabar);color:#fdf6e8}
a.solid:hover{filter:brightness(1.08);transform:translateY(-1px)}
a.ghost{border-color:var(--line);color:var(--ink);background:var(--surface)}
a.ghost:hover{border-color:var(--accent);color:var(--accent)}
.cred{margin-top:2.8rem;padding-top:1.3rem;border-top:1px solid var(--line);
  color:var(--dim);font-size:12px;letter-spacing:.08em;max-width:34em;margin-inline:auto}
.cred i{font-style:normal;color:var(--cinnabar)}
</style>
</head>
<body>
  <main>
    <div class="seal" aria-hidden="true"><span>绍</span><span>派</span><span>伤</span><span>寒</span></div>
    <h1>页面未找到</h1>
    <div class="sub">404 · Page Not Found</div>
    <p class="msg">您访问的页面不存在，或已迁移。请注意网址区分大小写——
       本站路径为 <b>/Shaopai-Shanghan/</b>。</p>
    <div class="acts">
      <a class="btn solid" href="/Shaopai-Shanghan/">返回首页</a>
      <a class="btn ghost" href="/Shaopai-Shanghan/explorer.html">进入知识图谱</a>
    </div>
    <div class="cred">
      绍派伤寒 · 学术知识图谱<br>
      <i>沈钦荣名中医</i> × <i>医哲未来人工智能研究院</i> 联合研发
    </div>
  </main>
</body>
</html>
